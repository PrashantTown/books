# Run by hand from the repository's Actions tab: "Database tasks" > Run workflow.
#
#   test       runs the test suites against the MONGODB_URI_TEST database
#   seed       adds the demo accounts and sample content to the MONGODB_URI database
#   add-admin  adds an administrator (fill in admin_email and admin_name); they
#              set their own password with "Forgot your password?" on the site
#
# Uses these repository secrets (Settings > Secrets and variables > Actions):
# MONGODB_URI, MONGODB_URI_TEST, SEED_ADMIN_PASSWORD, SEED_PARENT_PASSWORD.
name: Database tasks

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [test, seed, add-admin]
        default: test
      admin_email:
        description: "add-admin only: the administrator's email (they sign in with it and get their codes there)"
        type: string
        required: false
      admin_name:
        description: "add-admin only: their name"
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    if: inputs.task == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI_TEST }}
      TZ: Australia/Brisbane
    steps:
      - name: Check the test database is set
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::Add the MONGODB_URI_TEST secret first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: All test suites
        run: npx jest --detectOpenHandles --forceExit --json --outputFile=jest-results.json
      # Repeat the summary and each failure as annotations, so they show on the
      # run's summary page without opening the full log.
      - name: Summarise results
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const clean = (s) => String(s || "").replace(/\x1b\[[0-9;]*m/g, "").split("\n").filter(Boolean).slice(0, 5).join(" | ").slice(0, 900);
            if (!fs.existsSync("jest-results.json")) { console.log("::error::The tests did not produce results (see the log)"); process.exit(0); }
            const r = JSON.parse(fs.readFileSync("jest-results.json", "utf8"));
            const line = `Tests: ${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numTotalTests} total`;
            console.log(r.numFailedTests || r.numRuntimeErrorTestSuites ? `::error::${line}` : `::notice::${line}`);
            for (const s of r.testResults) {
              const failed = s.assertionResults.filter((a) => a.status === "failed");
              if (s.status === "failed" && !failed.length) console.log(`::error title=${s.name.split("/").pop()}::${clean(s.message)}`);
              for (const a of failed.slice(0, 8)) console.log(`::error title=${a.fullName.slice(0, 100)}::${clean(a.failureMessages[0])}`);
            }
          '

  seed:
    if: inputs.task == 'seed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      SEED_PARENT_PASSWORD: ${{ secrets.SEED_PARENT_PASSWORD }}
    steps:
      # This repository is public, so never fall back to the demo passwords here.
      - name: Check the secrets are set
        run: |
          for v in MONGODB_URI SEED_ADMIN_PASSWORD SEED_PARENT_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Add the $v secret first (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          if [ ${#SEED_ADMIN_PASSWORD} -lt 12 ]; then echo "::error::SEED_ADMIN_PASSWORD needs at least 12 characters."; exit 1; fi
          if [ ${#SEED_PARENT_PASSWORD} -lt 8 ]; then echo "::error::SEED_PARENT_PASSWORD needs at least 8 characters."; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add demo accounts and sample content
        run: |
          set +e
          node scripts/seed.js > seed.log 2>&1
          code=$?
          cat seed.log
          if [ $code -ne 0 ]; then
            echo "::error::$(grep -v '^\s*$' seed.log | tail -n 3 | tr '\n' ' ')"
            exit $code
          fi
          echo "::notice::Demo data is ready: admin and demo parent accounts created."

  add-admin:
    if: inputs.task == 'add-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      ADMIN_EMAIL: ${{ inputs.admin_email }}
      ADMIN_NAME: ${{ inputs.admin_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add the administrator
        run: |
          if node scripts/add-admin.js --email "$ADMIN_EMAIL" --name "$ADMIN_NAME" > add-admin.log 2>&1; then
            echo "::notice::$(head -n 1 add-admin.log)"
          else
            echo "::error::$(tail -n 1 add-admin.log)"
            exit 1
          fi
