# Render Blueprint for the Parents Go To API.
#
# In the Render dashboard: New > Blueprint, connect this repository, fill in
# the two values Render asks for (MONGODB_URI and ADMIN_LOGIN_CODE), then
# Deploy Blueprint. Render creates JWT_SECRET itself.
services:
  - type: web
    name: parents-go-to-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Reading-hours limits are checked on the server clock.
      - key: TZ
        value: Australia/Brisbane
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGINS
        value: https://parents-go-to.vercel.app,https://parentsgoto.vercel.app,https://parents-go-to-live.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_LOGIN_CODE
        sync: false
      # Email: password reset links, confirming new accounts, and a fresh
      # six-digit code for every administrator sign-in. Add BREVO_API_KEY and
      # MAIL_FROM (a sender verified in Brevo) under Environment in the
      # dashboard; until then these emails are off and ADMIN_LOGIN_CODE is used.
      - key: MAIL_FROM_NAME
        value: Parents Go To
      # Where links in emails open when a request didn't come from one of the
      # CORS_ORIGINS sites (they normally do). Contact messages and problem
      # reports are emailed to every administrator, or to SUPPORT_EMAIL if you
      # add it (comma-separated addresses).
      - key: SITE_URL
        value: https://parents-go-to-live.vercel.app
